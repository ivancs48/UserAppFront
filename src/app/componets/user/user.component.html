@if (users.length == 0){
    <div class="alert alert-warning">No hay registros en el sistema!</div>
    } @else {
    <table class="table tabñe-hover table-striped">
        <thead></thead>
        <tr>
            <!--<th>id</th>-->
            <th>name</th>
            <th>lastaname</th>
            <th>email</th>
            <th>username</th>
            <th>update</th>
            <th>remove</th>
        </tr>
        <tbody>
            @for(user of users; track $index) {
            <tr>
                <!--<td>{{user.id}}</td> -->
                <td>{{user.name}}</td>
                <td>{{user.lastName}}</td>
                <td>{{user.email}}</td>
                <td>{{user.username}}</td>
                <td>
                    <button class="btn btn-info btn-sm"
                    (click)="onSelectedUser(user)">
                        update
                    </button>
                </td>
                <td>
                    <button class="btn btn-danger btn-sm"
                    (click)="onRemoveUser(user.id)">
                        remove
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </table>
    }
